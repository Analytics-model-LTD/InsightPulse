kpi_set:
  name: "testing sagar"
  llm: "claude-sonnet-5-5"
  detector: "iforest"            # several measures together, not one at a time
  detector_params: { contamination: 0.03 }
  source: source_table
  time_column: DateColumn
  grain: month
  measures:
  dimensions: []
  top_n: 3
  top_n_strategy: manual
  alerting:
    z_threshold: 3.0
    min_abs_change: 500         # revenue units
    min_pct_change: 0.1
    channels: [email, webhook]
    recipients:
  min_n: 7